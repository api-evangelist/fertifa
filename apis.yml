aid: fertifa
name: Fertifa
description: >-
  Fertifa is Europe's reproductive healthcare benefits provider for employers,
  giving companies a way to offer fertility, family-forming, women's health,
  maternity, menopause, men's reproductive health, and neurodiversity support to
  their employees. The platform pairs an in-house clinical team with education
  and training, diagnostics and testing, prescriptions and medication delivery,
  and financing/reimbursement, delivered to staff through a mobile app and to HR
  teams through enterprise and SME plans. Fertifa is London-based, backed by
  Speedinvest, and works with employers including Lululemon, Meta, Bain Capital,
  and Virgin. No public developer API or OpenAPI surface is currently published;
  this profile captures the company's public web, legal, and support properties.
